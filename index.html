<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风华锦澜里 · 3D 业主入群分布</title>
<style>
  :root{
    /* 平面暗色: 彩色只给数据, 琥珀=入群数据 */
    --bg:#0b0d10;--surface:#14161a;--surface-2:#1d2025;--border:#272a30;--line:#202329;
    --text:#edeff2;--muted:#a3a8b0;--faint:#6e747d;
    --amber:#f0a24a;--amber-tint:#33270f;--amber-ink:#f2b269;--amber-line:#4a3a1c;
    --mono:"SF Mono","JetBrains Mono","Roboto Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none}
  .ui{position:fixed;z-index:5;pointer-events:none}
  .ui a,.ui button,.ui .chip,.ui .panel{pointer-events:auto}
  ::selection{background:var(--amber);color:#191104}

  /* brand */
  .brand{top:28px;left:32px;max-width:400px}
  .brand-top{display:flex;align-items:center;gap:12px}
  .mark{width:34px;height:34px;border-radius:9px;background:var(--amber);color:#191104;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex:none}
  .brand h1{font-size:21px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
  .scope{font-size:11px;color:var(--faint);margin-top:3px}
  .brand .sub{color:var(--muted);font-size:12px;margin-top:12px;line-height:1.7;max-width:350px}
  .stat-row{display:flex;margin-top:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;width:fit-content}
  .stat-row .st{padding:10px 18px}
  .stat-row .st + .st{border-left:1px solid var(--line)}
  .stat-row .st b{display:block;font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat-row .st b i{font-style:normal;font-size:11px;color:var(--faint);margin-left:3px}
  .stat-row .st span{display:block;color:var(--faint);font-size:11px;margin-top:3px}
  .stat-row .st.accent b{color:var(--amber-ink)}

  /* controls */
  .top-right{top:28px;right:32px;display:flex;gap:8px;align-items:center;transition:right .42s cubic-bezier(.22,.9,.24,1)}
  .btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;cursor:pointer;transition:background .15s,color .15s;text-decoration:none;font-family:inherit}
  .btn:hover{color:var(--text);background:var(--surface-2)}
  .btn.on{background:var(--text);border-color:var(--text);color:var(--bg)}
  .btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5}
  .btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

  /* legend */
  .legend{left:32px;bottom:28px;display:flex;gap:16px;align-items:center;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
  .legend span{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .legend .on{background:var(--amber)}
  .legend .off{background:var(--surface-2);border:1px solid var(--border)}
  .legend .inf{background:transparent;border:1px dashed var(--amber-ink);width:9px;height:9px}
  .legend .void{background:transparent;border:1px dashed var(--faint);width:9px;height:9px}

  .compass{right:34px;bottom:28px;width:40px;text-align:center;color:var(--faint);font-size:11px}
  .compass .n{width:32px;height:32px;margin:0 auto 4px;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--amber);font-size:11px;font-family:var(--mono);position:relative;background:var(--surface)}
  .compass .n::after{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-bottom-color:var(--amber)}

  #tip{position:fixed;z-index:9;padding:8px 11px;border-radius:8px;background:var(--surface);border:1px solid var(--border);box-shadow:0 8px 28px rgba(0,0,0,.35);font-size:12px;color:var(--muted);opacity:0;transform:translate(12px,-50%);transition:opacity .12s;white-space:nowrap;pointer-events:none}
  #tip b{color:var(--text);font-family:var(--mono);font-weight:500;margin-right:6px}
  #tip em{font-style:normal;color:var(--amber-ink);font-family:var(--mono)}

  /* side panel */
  .panel{top:0;right:0;height:100%;width:380px;padding:28px 26px 24px;position:fixed;background:var(--surface);border-left:1px solid var(--border);transform:translateX(102%);transition:transform .42s cubic-bezier(.22,.9,.24,1);display:flex;flex-direction:column;overflow:hidden;z-index:6}
  .panel.open{transform:translateX(0)}
  body:has(.panel.open) .top-right{right:416px}
  .p-top{display:flex;align-items:flex-start;justify-content:space-between}
  .p-name{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1}
  .p-type{display:inline-block;margin-top:9px;padding:3px 9px;border-radius:6px;background:var(--surface-2);color:var(--muted);font-size:11px}
  .p-close{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:14px;cursor:pointer;line-height:1;transition:.15s}
  .p-close:hover{color:var(--text);background:var(--surface-2)}
  .p-hero{display:flex;align-items:center;gap:18px;margin-top:22px}
  .ring{width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--amber) calc(var(--p)*1%), var(--surface-2) 0);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
  .ring::after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
  .ring span{position:relative;z-index:1;font-family:var(--mono);font-size:16px;color:var(--amber-ink)}
  .p-num{font-family:var(--mono);font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .p-num small{font-size:13px;color:var(--faint);letter-spacing:0}
  .p-num .pct{font-size:13px;color:var(--amber-ink);margin-left:8px}
  .p-sub{color:var(--faint);font-size:11px;margin-top:4px}
  .p-bar{height:4px;background:var(--surface-2);border-radius:2px;margin-top:16px;overflow:hidden}
  .p-bar i{display:block;height:100%;background:var(--amber);border-radius:2px}
  .p-section{display:flex;justify-content:space-between;align-items:baseline;margin-top:22px;padding-bottom:8px;border-bottom:1px solid var(--line);color:var(--faint);font-size:11px}
  .p-floors{flex:1;overflow-y:auto;margin:4px -8px 0 0;padding-right:8px}
  .p-floors::-webkit-scrollbar{width:4px}
  .p-floors::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .frow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .frow .fno{width:34px;font-family:var(--mono);font-size:11px;color:var(--faint);flex:none}
  .fchips{display:flex;gap:5px;flex:1;flex-wrap:wrap}
  .frow.merged .fchips{flex-wrap:nowrap}
  .frow.merged .chip{flex:1;text-align:center}
  .chip{font-family:var(--mono);font-size:10.5px;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid transparent;letter-spacing:.02em;line-height:1.3}
  .chip.on{background:var(--amber-tint);color:var(--amber-ink);border-color:var(--amber-line)}
  .chip.inf{background:transparent;color:var(--amber-ink);border:1px dashed var(--amber-line)}
  .frow .fc{font-family:var(--mono);font-size:10px;color:var(--faint);width:28px;text-align:right;flex:none}
  .frow .fc.full{color:var(--amber-ink)}
  .frow.void{opacity:.55}
  .frow.void .fchips{color:var(--faint);font-size:10px}
  .p-note{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--faint);font-size:11px;line-height:1.7}

  /* loading */
  #load{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .7s}
  #load.done{opacity:0;pointer-events:none}
  #load .l-title{font-size:13px;color:var(--muted);letter-spacing:.1em}
  #load .l-line{width:160px;height:3px;border-radius:2px;background:var(--surface-2);overflow:hidden}
  #load .l-line i{display:block;height:100%;width:40%;background:var(--amber);animation:load 1.1s ease-in-out infinite}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

  #themeBtn .ic-moon{display:none}
  body.day #themeBtn .ic-sun{display:none}
  body.day #themeBtn .ic-moon{display:inline}

  body.day{
    --bg:#eef1f4;--surface:#ffffff;--surface-2:#f0f2f5;--border:#e3e6ea;--line:#eceff2;
    --text:#16181b;--muted:#5c6167;--faint:#8a9097;
    --amber:#c07a2d;--amber-tint:#faeeda;--amber-ink:#9a5f1c;--amber-line:#e8cf9f;
  }

  @media (max-width:900px){
    .brand{top:20px;left:20px;right:150px}
    .brand .sub{display:none}
    .stat-row .st{padding:8px 12px}
    .stat-row .st b{font-size:18px}
    .top-right{top:16px;right:16px;flex-direction:column;align-items:flex-end}
    .btn{height:30px;padding:0 10px}
    .legend{left:20px;bottom:20px;gap:12px;padding:8px 12px}
    .compass{right:20px;bottom:20px}
    .panel{width:100%;max-width:420px}
    body:has(.panel.open) .top-right{right:16px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="load"><div class="l-title">风华锦澜里</div><div class="l-line"><i></i></div></div>

<div class="ui brand">
  <div class="brand-top">
    <div class="mark">锦</div>
    <div>
      <h1>风华锦澜里</h1>
      <div class="scope">BROCADE · 业主群数据</div>
    </div>
  </div>
  <div class="sub">每一扇亮起的窗，代表一户已入群的业主家庭。<br>点击楼栋查看逐户状态 · 拖拽旋转 · 滚轮缩放</div>
  <div class="stat-row">
    <div class="st accent"><b><span id="kJoined">182</span><i>户</i></b><span>已入群</span></div>
    <div class="st"><b><span id="kTotal">478</span><i>户</i></b><span>全盘户数</span></div>
    <div class="st"><b><span id="kRate">38.1</span><i>%</i></b><span>覆盖率</span></div>
  </div>
</div>

<div class="ui top-right">
  <button class="btn" id="themeBtn"><svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ic-moon" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg><span id="themeTxt">日间模式</span></button>
  <button class="btn" id="tour"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="5"/></svg>自动巡览</button>
  <button class="btn" id="reset"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 2.3 6.3"/><path d="M4 5v5h5"/></svg>重置视角</button>
  <a class="btn" href="report.html">统计报表</a>
</div>

<div class="ui legend">
  <span><i class="on"></i>已入群</span>
  <span><i class="off"></i>未入群</span>
  <span><i class="void"></i>架空层</span>
</div>
<div class="ui compass"><div class="n">N</div>北</div>

<div id="tip"><b></b><span></span></div>

<aside class="panel" id="panel">
  <div class="p-top">
    <div><div class="p-name" id="pName">4#</div><span class="p-type" id="pType">高层 · 16F</span></div>
    <button class="p-close" id="pClose">×</button>
  </div>
  <div class="p-hero">
    <div class="ring" id="pRing" style="--p:0"><span id="pPct">0%</span></div>
    <div>
      <div class="p-num"><span id="pJoined">0</span><small> / <span id="pTotal">0</span> 户</small><span class="pct" id="pDelta"></span></div>
      <div class="p-sub" id="pSub">已入群家庭</div>
    </div>
  </div>
  <div class="p-bar"><i id="pBar" style="width:0%"></i></div>
  <div class="p-section"><span>楼层 / 房号</span><span>已入群</span></div>
  <div class="p-floors" id="pFloors"></div>
  <div class="p-note" id="pNote">逐户状态按房号归并，不含业主姓名。</div>
</aside>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.min.js"></script>
<script src="data/app-data.js?v=14"></script>
<script>
(function(){
  const D = window.APP_DATA;
  if(!D) return;

  document.getElementById('kJoined').textContent = D.meta.households;
  document.getElementById('kTotal').textContent = D.meta.totalHouseholds;
  document.getElementById('kRate').textContent = (D.meta.coverage*100).toFixed(1);

  const B = D.buildings;
  const rooms = D.rooms;
  const roomsByB = {};
  rooms.forEach(r => (roomsByB[r.b] = roomsByB[r.b] || []).push(r));

  /* ---------- renderer ---------- */
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x070b12);
  scene.fog = new THREE.Fog(0x070b12, 800, 1600);

  const colFaders = [], numFaders = [];
  function regColor(inst, n, d){ colFaders.push({c:inst, n:new THREE.Color(n), d:new THREE.Color(d)}); }
  function regNum(o, p, n, d){ numFaders.push({o, p, n, d}); }
  regColor(scene.background, 0x070b12, 0xbcd6ea);
  regColor(scene.fog.color, 0x070b12, 0xc2d9ea);
  regNum(renderer, 'toneMappingExposure', 1.08, 1.05);

  const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 1, 2000);
  // 左前方俯视（西南角），与官方示意图视角一致
  const HOME_POS = new THREE.Vector3(-170, 270, 420);
  const HOME_TARGET = new THREE.Vector3(-60, 10, 0);
  camera.position.copy(HOME_POS);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.copy(HOME_TARGET);
  controls.enableDamping = true;
  controls.dampingFactor = 0.12;
  controls.minDistance = 70;
  controls.maxDistance = 1100;
  controls.maxPolarAngle = Math.PI * 0.485;
  controls.autoRotateSpeed = 0.55;
  controls.enablePan = false;
  controls.update();

  /* ---------- lights ---------- */
  const hemi = new THREE.HemisphereLight(0x9db3d6, 0x0a0e15, 0.62);
  regColor(hemi.color, 0x9db3d6, 0xd8e6f5);
  regColor(hemi.groundColor, 0x0a0e15, 0x9aa78c);
  regNum(hemi, 'intensity', 0.62, 0.72);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffe2c0, 1.45);
  regColor(sun.color, 0xffe2c0, 0xfff6e6);
  regNum(sun, 'intensity', 1.45, 1.35);
  sun.position.set(-110, 190, 120);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -200; sun.shadow.camera.right = 200;
  sun.shadow.camera.top = 200; sun.shadow.camera.bottom = -200;
  sun.shadow.camera.near = 10; sun.shadow.camera.far = 520;
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  const rim = new THREE.DirectionalLight(0x6a8dff, 0.34);
  regColor(rim.color, 0x6a8dff, 0xaac8ee);
  regNum(rim, 'intensity', 0.34, 0.12);
  rim.position.set(160, 90, -180);
  scene.add(rim);

  const warm = new THREE.PointLight(0xffb45c, 0.5, 260, 2);
  regNum(warm, 'intensity', 0.5, 0);
  warm.position.set(0, 40, 30);
  scene.add(warm);

  /* ---------- sky domes: night starfield / day blue sky & clouds ---------- */
  function makeSky(day){
    const cv = document.createElement('canvas'); cv.width = 2048; cv.height = 1024;
    const g = cv.getContext('2d');
    const grd = g.createLinearGradient(0,0,0,1024);
    if(day){
      grd.addColorStop(0,'#2e6cc4'); grd.addColorStop(.45,'#6aa6e2');
      grd.addColorStop(.75,'#b9dcf2'); grd.addColorStop(1,'#eaf5fc');
    }else{
      grd.addColorStop(0,'#01030a'); grd.addColorStop(.55,'#070b12'); grd.addColorStop(1,'#122036');
    }
    g.fillStyle = grd; g.fillRect(0,0,2048,1024);
    const rnd = mulberry32(day ? 20261105 : 20261104);
    if(day){
      const sx = 1560, sy = 210;
      const sg = g.createRadialGradient(sx,sy,10,sx,sy,360);
      sg.addColorStop(0,'rgba(255,252,235,.95)'); sg.addColorStop(.22,'rgba(255,246,205,.5)'); sg.addColorStop(1,'rgba(255,246,205,0)');
      g.fillStyle = sg; g.fillRect(0,0,2048,1024);
      g.fillStyle = '#fffbe8'; g.beginPath(); g.arc(sx,sy,34,0,7); g.fill();
      for(let i=0;i<24;i++){
        const cx = rnd()*2048, cy = 140+rnd()*600, s = 26+rnd()*64;
        const puffs = 5 + Math.floor(rnd()*6);
        for(let j=0;j<puffs;j++){
          const ox = (rnd()-.5)*s*3.4, oy = (rnd()-.5)*s*.8, r = s*(.5+rnd()*.65);
          const a = .22 + rnd()*.4;
          const cg = g.createRadialGradient(cx+ox,cy+oy,0,cx+ox,cy+oy,r);
          cg.addColorStop(0,`rgba(255,255,255,${a})`); cg.addColorStop(1,'rgba(255,255,255,0)');
          g.fillStyle = cg; g.beginPath(); g.arc(cx+ox,cy+oy,r,0,7); g.fill();
        }
      }
    }else{
      for(let i=0;i<850;i++){
        const x = rnd()*2048, y = rnd()*880;
        const r = rnd()*1.3+.3, a = .2+rnd()*.75;
        g.fillStyle = `rgba(${220+Math.floor(rnd()*35)},${228+Math.floor(rnd()*27)},255,${a})`;
        g.beginPath(); g.arc(x,y,r,0,7); g.fill();
      }
      const mx = 400, my = 190;
      const mg = g.createRadialGradient(mx,my,8,mx,my,150);
      mg.addColorStop(0,'rgba(228,238,252,.55)'); mg.addColorStop(1,'rgba(228,238,252,0)');
      g.fillStyle = mg; g.beginPath(); g.arc(mx,my,150,0,7); g.fill();
      g.fillStyle = '#e9eff9'; g.beginPath(); g.arc(mx,my,26,0,7); g.fill();
      g.fillStyle = 'rgba(190,205,228,.5)';
      g.beginPath(); g.arc(mx-8,my-6,5,0,7); g.fill();
      g.beginPath(); g.arc(mx+9,my+8,4,0,7); g.fill();
    }
    const tex = new THREE.CanvasTexture(cv); tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  function makeSkyDome(tex){
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(880, 48, 24),
      new THREE.MeshBasicMaterial({map:tex, side:THREE.BackSide, fog:false, transparent:true, depthWrite:false})
    );
    m.renderOrder = -1;
    scene.add(m);
    return m;
  }
  const skyNight = makeSkyDome(makeSky(false));
  const skyDay = makeSkyDome(makeSky(true));

  /* ---------- site plan texture ---------- */
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  // 场地南北长、东西短：180（东西）× 480（南北），北留河道退距
  const SITE_W = 180, SITE_D = 480;
  const W = 900, H = 2100;
  const px = x => (x + SITE_W/2) / SITE_W * W;
  const py = z => (z + SITE_D/2) / SITE_D * H;

  const SITE_PAL = {
    night: {
      base:'#0a1210', vig:'rgba(30,48,42,.5)', lawn:'#101b16',
      river:['#0a1c28','#0d2836','#0b1f2b'], wave:'rgba(120,180,200,.10)',
      bank:'rgba(9,14,13,.9)', bankEdge:'rgba(120,160,130,.10)',
      road:'#101317', roadDash:'rgba(228,235,242,.6)',
      path:'#1b2629', pathDash:'rgba(210,200,180,.10)',
      plaza:'#141f22', pool:'#0e2b35', poolEdge:'rgba(120,210,220,.18)',
      belt:'rgba(22,44,34,.55)',

  function drawSite(day){

    g.strokeStyle = P.poolEdge; g.lineWidth = 2;
    g.beginPath(); g.ellipse(px(0), py(15), px(18)-px(0), py(10)-py(0), 0, 0, Math.PI*2); g.stroke();

  /* 外围草甸贴图（旷野风格，日夜双套） */
  function drawMeadow(day){

  [[-805,-575,260,135],[288,-874,300,150],[805,-483,240,125],[897,230,260,135],[575,782,280,145],[-518,874,300,150],[-909,345,260,130]].forEach(([x,z,r,h])=>{

  function resetView(){
    closePanel();
    camAnim = {t:0, fromPos:camera.position.clone(), toPos:HOME_POS.clone(), fromT:controls.target.clone(), toT:HOME_TARGET.clone(), dur:0.45};
  }

  const ease = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;

  document.getElementById('pClose').addEventListener('click', closePanel);
  document.getElementById('reset').addEventListener('click', resetView);
  const tourBtn = document.getElementById('tour');
  tourBtn.addEventListener('click', ()=>{
    controls.autoRotate = !controls.autoRotate;
    tourBtn.classList.toggle('on', controls.autoRotate);
  });

  /* ---------- day / night theme ---------- */
  let themeT = 0, themeTarget = 0;
  const themeBtn = document.getElementById('themeBtn');
  const themeTxt = document.getElementById('themeTxt');
  function applyTheme(day, instant){
    document.body.classList.toggle('day', day);
    themeTxt.textContent = day ? '夜间模式' : '日间模式';
    try{ localStorage.setItem('spax-theme-v2', day ? 'day' : 'night'); }catch(_){}
    themeTarget = day ? 1 : 0;
    if(instant) themeT = themeTarget;
    siteMat.map = day ? siteDayTex : siteNightTex; siteMat.needsUpdate = true;
    outer.material.map = day ? outerDayTex : outerNightTex; outer.material.needsUpdate = true;
    /* 纯色贴图材质: 切日夜贴图（Basic+map 渲染准确） */
    const setC = m => { m.map = day ? m.userData.dayTex : m.userData.nightTex; m.needsUpdate = true; };
    themedMats.forEach(setC);
    facades.forEach(f=>{
      const k = day ? 'd' : 'n';
      if(!f[k]) f[k] = makeFacade(f.b, day);
      f.mat.map = f[k].map;
      f.mat.emissiveMap = f[k].glow;
      f.mat.needsUpdate = true;
    });
  }
  themeBtn.addEventListener('click', ()=>applyTheme(themeTarget < 0.5));
  applyTheme((()=>{ try{ return localStorage.getItem('spax-theme-v2') !== 'night'; }catch(_){ return true; } })(), true);

  function toNDC(e){
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  }

  function pick(e){
    toNDC(e);
    ray.setFromCamera(mouse, camera);
    const hits = ray.intersectObjects(pickMeshes, false);
    return hits.length ? hits[0].object.userData.b : null;
  }

  let down = null;
  canvas.addEventListener('pointerdown', e=>{ down = {x:e.clientX, y:e.clientY}; camAnim = null; });
  canvas.addEventListener('pointerup', e=>{
    if(!down) return;
    const moved = Math.hypot(e.clientX-down.x, e.clientY-down.y);
    down = null;
    if(moved > 5) return;
    const b = pick(e);
    if(b) openPanel(b); else closePanel();
  });

  canvas.addEventListener('pointermove', e=>{
    const b = pick(e);
    if(b !== hovered){
      hovered = b;
      canvas.style.cursor = b ? 'pointer' : 'grab';
    }
    if(b){
      const p = (b.rate*100).toFixed(1);
      tip.querySelector('b').textContent = b.name;
      tip.querySelector('span').innerHTML = `${b.joined}/${b.total} 户已入群 · <em>${p}%</em>`;
      tip.style.left = e.clientX+'px';
      tip.style.top = e.clientY+'px';
      tip.style.opacity = 1;
    } else {
      tip.style.opacity = 0;
    }
  });
  canvas.addEventListener('pointerleave', ()=>{ tip.style.opacity = 0; hovered = null; });

  /* ---------- animation ---------- */
  const t0 = performance.now();
  let introDone = false;

  function animate(){
    requestAnimationFrame(animate);
    const now = performance.now();

    if(!introDone){
      const t = (now - t0) / 820;
      let done = true;
      groups.forEach((g,i)=>{
        const local = Math.min(1, Math.max(0, (t - i*0.022) / 0.72));
        const e = 1 - Math.pow(1-local, 3);
        g.scale.y = Math.max(0.001, e);
        const l = Math.min(1, Math.max(0, (local - 0.25) / 0.75));
        labels[i].material.opacity = l * 0.95;
        if(local < 1) done = false;
      });
      if(done && t > 1.05){ introDone = true; }
      if(t < 1){
        const k = ease(Math.min(1, t));
        camera.position.lerpVectors(new THREE.Vector3(-195,300,460), HOME_POS, k);
      }
    }

    if(camAnim){
      camAnim.t += 0.016;
      const k = ease(Math.min(1, camAnim.t / camAnim.dur));
      camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, k);
      controls.target.lerpVectors(camAnim.fromT, camAnim.toT, k);
      if(camAnim.t >= camAnim.dur) camAnim = null;
    }

    if(selected){
      const t = now * 0.0016;
      ring.material.opacity = 0.38 + Math.sin(t)*0.16;
      ring2.material.opacity = 0.08 + Math.sin(t+1)*0.04;
    }

    themeT += (themeTarget - themeT) * 0.065;
    if(Math.abs(themeTarget - themeT) < 0.0015) themeT = themeTarget;
    colFaders.forEach(f=>f.c.copy(f.n).lerp(f.d, themeT));
    numFaders.forEach(f=>{ f.o[f.p] = f.n + (f.d - f.n) * themeT; });
    skyNight.material.opacity = 1 - themeT;
    skyDay.material.opacity = themeT;
    skyNight.position.copy(camera.position);
    skyDay.position.copy(camera.position);
    controls.update();
    renderer.render(scene, camera);
  }

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  animate();
  setTimeout(()=>document.getElementById('load').classList.add('done'), 420);

  window.__APP = {D, openPanel, resetView, scene, canalGrp, renderer, camera, controls};
})();
</script>
</body>
</html>
