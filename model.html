<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风华锦澜里 · 高保真 3D 住区</title>
<style>
  :root{
    --bg:#071019;--text:#edf2f9;--muted:#93a0b3;--faint:#5f6c7e;
    --amber:#f6b26b;--amber-2:#ffd2a1;--line:rgba(255,255,255,.09);
    --glass:rgba(9,15,25,.76);--mono:"SF Mono","JetBrains Mono","Roboto Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none}
  .ui{position:fixed;z-index:5;pointer-events:none}
  .ui a,.ui button,.ui .panel{pointer-events:auto}
  .brand{top:32px;left:36px;max-width:420px}
  .kicker{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
  .kicker .dot{width:5px;height:5px;border-radius:50%;background:var(--amber);box-shadow:0 0 10px var(--amber)}
  .brand h1{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:12px;line-height:1.25}
  .brand h1 em{font-style:normal;color:var(--amber)}
  .brand .sub{color:var(--muted);font-size:12px;margin-top:8px;line-height:1.65;max-width:360px}
  .stat-row{display:flex;gap:26px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
  .stat-row .st b{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.02em}
  .stat-row .st b i{font-style:normal;font-size:10px;color:var(--faint);margin-left:2px}
  .stat-row .st span{display:block;color:var(--faint);font-size:10px;letter-spacing:.06em;margin-top:2px}
  .stat-row .st.accent b{color:var(--amber)}
  .top-right{top:32px;right:36px;display:flex;gap:8px;align-items:center}
  .btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);color:var(--muted);font-size:11px;letter-spacing:.04em;cursor:pointer;transition:.2s;text-decoration:none}
  .btn:hover{color:var(--text);border-color:rgba(246,178,107,.35)}
  .btn.on{color:var(--amber);border-color:rgba(246,178,107,.45);background:rgba(246,178,107,.08)}
  .btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6}
  .legend{left:36px;bottom:30px;display:flex;gap:18px;align-items:center;padding:11px 16px;border:1px solid var(--line);border-radius:10px;background:var(--glass);backdrop-filter:blur(16px)}
  .legend span{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:10px;letter-spacing:.04em}
  .legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
  .legend .on{background:var(--amber);box-shadow:0 0 6px rgba(246,178,107,.6)}
  .legend .off{background:#223043}
  .legend .void{background:#161e2a}
  .hint{left:36px;bottom:76px;color:var(--faint);font-size:10px;letter-spacing:.05em}
  .compass{right:38px;bottom:32px;width:46px;text-align:center;color:var(--faint);font-size:9px;letter-spacing:.14em}
  .compass .n{width:34px;height:34px;margin:0 auto 5px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--amber);font-size:11px;font-family:var(--mono);position:relative;background:var(--glass)}
  .compass .n::after{content:"";position:absolute;top:4px;left:50%;transform:translateX(-50%);border:4px solid transparent;border-bottom-color:var(--amber)}
  #tip{position:fixed;z-index:9;padding:8px 11px;border-radius:8px;background:rgba(8,13,22,.92);border:1px solid var(--line);backdrop-filter:blur(10px);font-size:11px;color:var(--muted);opacity:0;transform:translate(12px,-50%);transition:opacity .12s;white-space:nowrap;pointer-events:none}
  #tip b{color:var(--text);font-family:var(--mono);font-weight:500;margin-right:6px}
  #tip em{font-style:normal;color:var(--amber);font-family:var(--mono)}
  .panel{top:0;right:0;height:100%;width:380px;padding:30px 28px 26px;position:fixed;background:linear-gradient(180deg,rgba(9,15,25,.94),rgba(9,15,25,.86));border-left:1px solid var(--line);backdrop-filter:blur(22px);transform:translateX(102%);transition:transform .42s cubic-bezier(.22,.9,.24,1);display:flex;flex-direction:column;overflow:hidden;z-index:6}
  .panel.open{transform:translateX(0)}
  body:has(.panel.open) .top-right{right:418px}
  .p-top{display:flex;align-items:flex-start;justify-content:space-between}
  .p-name{font-size:32px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .p-type{display:block;color:var(--faint);font-size:10px;letter-spacing:.12em;margin-top:7px}
  .p-close{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:15px;cursor:pointer;line-height:1;transition:.2s}
  .p-close:hover{color:var(--text);border-color:rgba(255,255,255,.25)}
  .p-hero{display:flex;align-items:center;gap:20px;margin-top:24px}
  .ring{width:82px;height:82px;border-radius:50%;background:conic-gradient(var(--amber) calc(var(--p)*1%), rgba(255,255,255,.07) 0);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
  .ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#0a111c}
  .ring span{position:relative;z-index:1;font-family:var(--mono);font-size:17px;color:var(--amber)}
  .p-num{font-family:var(--mono);font-size:30px;letter-spacing:-.02em}
  .p-num small{font-size:13px;color:var(--faint);letter-spacing:0}
  .p-sub{color:var(--faint);font-size:10px;margin-top:5px;letter-spacing:.04em}
  .p-bar{height:3px;background:rgba(255,255,255,.07);border-radius:2px;margin-top:18px;overflow:hidden}
  .p-bar i{display:block;height:100%;background:linear-gradient(90deg,rgba(246,178,107,.5),var(--amber));border-radius:2px}
  .p-section{display:flex;justify-content:space-between;align-items:baseline;margin-top:24px;padding-bottom:10px;border-bottom:1px solid var(--line);color:var(--faint);font-size:9px;letter-spacing:.14em}
  .p-floors{flex:1;overflow-y:auto;margin:6px -8px 0 0;padding-right:8px}
  .p-floors::-webkit-scrollbar{width:4px}
  .p-floors::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
  .frow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.035)}
  .frow .fno{width:34px;font-family:var(--mono);font-size:10px;color:var(--faint);flex:none}
  .fchips{display:flex;gap:5px;flex:1;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:9.5px;padding:3px 6px;border-radius:4px;background:#182232;color:#66748a;border:1px solid transparent;letter-spacing:.02em;line-height:1.2}
  .chip.on{background:rgba(246,178,107,.15);color:var(--amber-2);border-color:rgba(246,178,107,.28)}
  .frow .fc{font-family:var(--mono);font-size:9px;color:var(--faint);width:28px;text-align:right;flex:none}
  .frow .fc.full{color:var(--amber)}
  .frow.void{opacity:.55}
  .frow.void .fchips{color:#3d4757;font-size:9px;letter-spacing:.1em}
  .p-note{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:var(--faint);font-size:9.5px;line-height:1.6}
  #load{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .7s}
  #load.done{opacity:0;pointer-events:none}
  #load .l-title{font-size:13px;letter-spacing:.28em;color:var(--muted)}
  #load .l-line{width:160px;height:1px;background:rgba(255,255,255,.08);overflow:hidden}
  #load .l-line i{display:block;height:100%;width:40%;background:var(--amber);animation:load 1.1s ease-in-out infinite}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  #themeBtn .ic-moon{display:none}
  body.day #themeBtn .ic-sun{display:none}
  body.day #themeBtn .ic-moon{display:inline}

  body.day{
    --bg:#dce7f0;--text:#1d2833;--muted:#54687e;--faint:#8593a5;
    --amber:#d98f3a;--amber-2:#b4742a;--line:rgba(23,43,63,.14);
    --glass:rgba(255,255,255,.74);
  }
  body.day .legend .off{background:#c7d2de}
  body.day .legend .void{background:#e6ebf1}
  body.day .chip{background:#e8edf3;color:#7c8a9b}
  body.day .chip.on{background:rgba(217,143,58,.15);color:#a96a20;border-color:rgba(217,143,58,.38)}
  body.day #tip{background:rgba(255,255,255,.94)}
  body.day .panel{background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.88))}
  body.day .ring::after{background:#f4f7fa}
  body.day .p-bar{background:rgba(23,43,63,.08)}
  body.day .p-floors::-webkit-scrollbar-thumb{background:rgba(23,43,63,.18)}
  body.day .frow{border-bottom-color:rgba(23,43,63,.06)}
  body.day .frow .fchips{color:#93a1b1}

  @media (max-width:900px){
    .brand{top:22px;left:20px;right:150px}
    .brand h1{font-size:23px}
    .brand .sub{display:none}
    .stat-row{gap:18px;margin-top:14px;padding-top:12px}
    .stat-row .st b{font-size:19px}
    .top-right{top:20px;right:20px;flex-direction:column;align-items:flex-end}
    .btn{height:30px;padding:0 11px}
    .legend{left:20px;bottom:20px;gap:12px;padding:9px 12px}
    .hint{display:none}
    .compass{right:20px;bottom:20px}
    .panel{width:100%;max-width:420px}
    body:has(.panel.open) .top-right{right:20px}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="load"><div class="l-title">风华锦澜里</div><div class="l-line"><i></i></div></div>

<div class="ui brand">
  <div class="kicker"><span class="dot"></span>BROCADE · 立体住区</div>
  <h1>灯火里的<br><em>风华锦澜里</em></h1>
  <div class="sub">以真实楼栋关系重建住区：左前方俯视，窗灯对应已入群家庭。<br>点击楼栋，查看逐户状态。</div>
  <div class="stat-row">
    <div class="st accent"><b><span id="kJoined">182</span><i>户</i></b><span>已入群</span></div>
    <div class="st"><b><span id="kTotal">478</span><i>户</i></b><span>全盘户数</span></div>
    <div class="st"><b><span id="kRate">38.1</span><i>%</i></b><span>覆盖率</span></div>
  </div>
</div>

<div class="ui top-right">
  <button class="btn" id="themeBtn"><svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="ic-moon" viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg><span id="themeTxt">日间模式</span></button>
  <button class="btn" id="tour"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="5"/></svg>自动巡览</button>
  <button class="btn" id="reset"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 2.3 6.3"/><path d="M4 5v5h5"/></svg>重置视角</button>
  <a class="btn" href="report.html">统计报表</a>
</div>

<div class="ui legend">
  <span><i class="on"></i>已入群</span>
  <span><i class="off"></i>未入群</span>
  <span><i class="void"></i>架空层</span>
</div>
<div class="ui hint">拖拽旋转 · 滚轮缩放 · 点击楼栋</div>
<div class="ui compass"><div class="n">N</div>北</div>
<div id="tip"><b></b><span></span></div>

<aside class="panel" id="panel">
  <div class="p-top">
    <div><div class="p-name" id="pName">1#</div><span class="p-type" id="pType">高层 · 16F</span></div>
    <button class="p-close" id="pClose">×</button>
  </div>
  <div class="p-hero">
    <div class="ring" id="pRing" style="--p:0"><span id="pPct">0%</span></div>
    <div>
      <div class="p-num"><span id="pJoined">0</span><small> / <span id="pTotal">0</span> 户</small></div>
      <div class="p-sub" id="pSub">已入群家庭</div>
    </div>
  </div>
  <div class="p-bar"><i id="pBar" style="width:0%"></i></div>
  <div class="p-section"><span>楼层 / 房号</span><span>已入群</span></div>
  <div class="p-floors" id="pFloors"></div>
  <div class="p-note" id="pNote">逐户状态按房号归并，不含业主姓名。</div>
</aside>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.min.js"></script>
<script src="data/app-data.js?v=14"></script>
<script>
(function(){
  const D = window.APP_DATA;
  if(!D) return;
  const B = D.buildings;
  const roomList = D.rooms;
  const roomsByB = {};
  roomList.forEach(r => (roomsByB[r.b] = roomsByB[r.b] || []).push(r));
  document.getElementById('kJoined').textContent = D.meta.households;
  document.getElementById('kTotal').textContent = D.meta.totalHouseholds;
  document.getElementById('kRate').textContent = (D.meta.coverage*100).toFixed(1);

  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x071019);
  scene.fog = new THREE.Fog(0x071019, 380, 850);

  const colFaders = [], numFaders = [];
  function regColor(inst, n, d){ colFaders.push({c:inst, n:new THREE.Color(n), d:new THREE.Color(d)}); }
  function regNum(o, p, n, d){ numFaders.push({o, p, n, d}); }
  regColor(scene.background, 0x071019, 0xbcd6ea);
  regColor(scene.fog.color, 0x071019, 0xc2d9ea);
  regNum(scene.fog, 'near', 380, 420);
  regNum(scene.fog, 'far', 850, 920);
  regNum(renderer, 'toneMappingExposure', 1.08, 1.1);

  const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 1, 2000);
  const HOME_POS = new THREE.Vector3(-190, 265, 340);
  const HOME_TARGET = new THREE.Vector3(0, 5, 0);
  camera.position.copy(HOME_POS);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.copy(HOME_TARGET);
  controls.enableDamping = true;
  controls.dampingFactor = 0.12;
  controls.minDistance = 80;
  controls.maxDistance = 620;
  controls.maxPolarAngle = Math.PI * 0.485;
  controls.autoRotateSpeed = 0.55;
  controls.enablePan = false;
  controls.update();

  const hemi = new THREE.HemisphereLight(0x9db3d6, 0x0a0e15, 0.62);
  regColor(hemi.color, 0x9db3d6, 0xd8e6f5);
  regColor(hemi.groundColor, 0x0a0e15, 0x9aa78c);
  regNum(hemi, 'intensity', 0.62, 0.85);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffe2c0, 1.45);
  regColor(sun.color, 0xffe2c0, 0xfff6e6);
  regNum(sun, 'intensity', 1.45, 1.5);
  sun.position.set(-110, 190, 120);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -200; sun.shadow.camera.right = 200;
  sun.shadow.camera.top = 200; sun.shadow.camera.bottom = -200;
  sun.shadow.camera.near = 10; sun.shadow.camera.far = 520;
  sun.shadow.bias = -0.0006;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x6a8dff, 0.34);
  regColor(rim.color, 0x6a8dff, 0xaac8ee);
  regNum(rim, 'intensity', 0.34, 0.12);
  rim.position.set(160, 90, -180);
  scene.add(rim);
  const warm = new THREE.PointLight(0xffb45c, 0.5, 260, 2);
  regNum(warm, 'intensity', 0.5, 0);
  warm.position.set(0, 40, 30);
  scene.add(warm);

  /* ---------- sky domes: night starfield / day blue sky & clouds ---------- */
  function makeSky(day){
    const cv = document.createElement('canvas'); cv.width = 2048; cv.height = 1024;
    const g = cv.getContext('2d');
    const grd = g.createLinearGradient(0,0,0,1024);
    if(day){
      grd.addColorStop(0,'#2e6cc4'); grd.addColorStop(.45,'#6aa6e2');
      grd.addColorStop(.75,'#b9dcf2'); grd.addColorStop(1,'#eaf5fc');
    }else{
      grd.addColorStop(0,'#01030a'); grd.addColorStop(.55,'#071019'); grd.addColorStop(1,'#122036');
    }
    g.fillStyle = grd; g.fillRect(0,0,2048,1024);
    const rnd = mulberry32(day ? 20261105 : 20261104);
    if(day){
      const sx = 1560, sy = 210;
      const sg = g.createRadialGradient(sx,sy,10,sx,sy,360);
      sg.addColorStop(0,'rgba(255,252,235,.95)'); sg.addColorStop(.22,'rgba(255,246,205,.5)'); sg.addColorStop(1,'rgba(255,246,205,0)');
      g.fillStyle = sg; g.fillRect(0,0,2048,1024);
      g.fillStyle = '#fffbe8'; g.beginPath(); g.arc(sx,sy,34,0,7); g.fill();
      for(let i=0;i<24;i++){
        const cx = rnd()*2048, cy = 140+rnd()*600, s = 26+rnd()*64;
        const puffs = 5 + Math.floor(rnd()*6);
        for(let j=0;j<puffs;j++){
          const ox = (rnd()-.5)*s*3.4, oy = (rnd()-.5)*s*.8, r = s*(.5+rnd()*.65);
          const a = .22 + rnd()*.4;
          const cg = g.createRadialGradient(cx+ox,cy+oy,0,cx+ox,cy+oy,r);
          cg.addColorStop(0,`rgba(255,255,255,${a})`); cg.addColorStop(1,'rgba(255,255,255,0)');
          g.fillStyle = cg; g.beginPath(); g.arc(cx+ox,cy+oy,r,0,7); g.fill();
        }
      }
    }else{
      for(let i=0;i<850;i++){
        const x = rnd()*2048, y = rnd()*880;
        const r = rnd()*1.3+.3, a = .2+rnd()*.75;
        g.fillStyle = `rgba(${220+Math.floor(rnd()*35)},${228+Math.floor(rnd()*27)},255,${a})`;
        g.beginPath(); g.arc(x,y,r,0,7); g.fill();
      }
      const mx = 400, my = 190;
      const mg = g.createRadialGradient(mx,my,8,mx,my,150);
      mg.addColorStop(0,'rgba(228,238,252,.55)'); mg.addColorStop(1,'rgba(228,238,252,0)');
      g.fillStyle = mg; g.beginPath(); g.arc(mx,my,150,0,7); g.fill();
      g.fillStyle = '#e9eff9'; g.beginPath(); g.arc(mx,my,26,0,7); g.fill();
      g.fillStyle = 'rgba(190,205,228,.5)';
      g.beginPath(); g.arc(mx-8,my-6,5,0,7); g.fill();
      g.beginPath(); g.arc(mx+9,my+8,4,0,7); g.fill();
    }
    const tex = new THREE.CanvasTexture(cv); tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  function makeSkyDome(tex){
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(880, 48, 24),
      new THREE.MeshBasicMaterial({map:tex, side:THREE.BackSide, fog:false, transparent:true, depthWrite:false})
    );
    m.renderOrder = -1;
    scene.add(m);
    return m;
  }
  const skyNight = makeSkyDome(makeSky(false));
  const skyDay = makeSkyDome(makeSky(true));

  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  const SITE_W = 240, SITE_D = 280;
  const W = 1680, H = 1960;
  const px = x => (x + SITE_W/2) / SITE_W * W;
  const py = z => (z + SITE_D/2) / SITE_D * H;

  const SITE_PAL = {
    night: {
      base:'#0a1210', vig:'rgba(30,48,42,.5)', plot:'#122019',
      river:['#0a1c28','#0d2836','#0b1f2b'], wave:'rgba(120,180,200,.10)',
      bank:'rgba(9,14,13,.9)', bankEdge:'rgba(120,160,130,.10)',
      outer:'#0e1115', roadDash:'rgba(180,190,200,.16)',
      path:'#1b2629', pathDash:'rgba(210,200,180,.10)',
      belt:'rgba(22,44,34,.55)',
      treeLo:22, treeSpan:22, treeFill:s=>`rgba(${s},${s+22},${s+12},.55)`, treeHi:'rgba(120,170,130,.07)',

    const vg = g.createRadialGradient(W*0.5,H*0.55,100,W*0.5,H*0.5,W*0.72);
    vg.addColorStop(0,P.vig); vg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = vg; g.fillRect(0,0,W,H);

    g.fillStyle = P.plot;
    g.fillRect(px(-105), py(-98), px(105)-px(-105), py(98)-py(-98));

    const rg = g.createLinearGradient(0, py(-138), 0, py(-100));
    rg.addColorStop(0,P.river[0]); rg.addColorStop(.55,P.river[1]); rg.addColorStop(1,P.river[2]);
    g.fillStyle = rg; g.fillRect(0, 0, W, py(-100));
    g.strokeStyle = P.wave; g.lineWidth = 2;
    for(let i=0;i<16;i++){
      const y = py(-136) + i*24;
      g.beginPath();
      for(let x=0;x<=W;x+=24){
        const yy = y + Math.sin(x*0.008 + i)*5;
        x===0 ? g.moveTo(x,yy) : g.lineTo(x,yy);
      }
      g.stroke();
    }
    g.fillStyle = P.bank; g.fillRect(0, py(-101.4), W, py(-100)-py(-101.4));
    g.fillStyle = P.bankEdge; g.fillRect(0, py(-100.2), W, 2);

    g.fillStyle = P.outer;
    g.fillRect(px(100), 0, px(120)-px(100), H);
    g.fillRect(0, py(100), W, py(120)-py(100));
    g.strokeStyle = P.roadDash; g.lineWidth = 3; g.setLineDash([22,26]);
    g.beginPath(); g.moveTo(px(110),0); g.lineTo(px(110),H); g.stroke();
    g.beginPath(); g.moveTo(0,py(110)); g.lineTo(W,py(110)); g.stroke();
    g.setLineDash([]);

    g.strokeStyle = P.path; g.lineWidth = 24; g.lineCap='round'; g.lineJoin='round';
    const paths = [
      [[-40,-95],[-40,95]], [[10,-95],[10,95]], [[60,-95],[60,95]],
      [[-110,-52],[110,-52]], [[-110,-2],[110,-2]],
      [[-110,62],[110,62]], [[-110,95],[110,95]],
    ];
    paths.forEach(p=>{
      g.beginPath();
      p.forEach(([x,z],i)=> i?g.lineTo(px(x),py(z)):g.moveTo(px(x),py(z)));
      g.stroke();
    });
    g.strokeStyle = P.pathDash; g.lineWidth = 1.5; g.setLineDash([10,16]);
    paths.forEach(p=>{
      g.beginPath();
      p.forEach(([x,z],i)=> i?g.lineTo(px(x),py(z)):g.moveTo(px(x),py(z)));
      g.stroke();
    });
    g.setLineDash([]);


    g.fillStyle = P.belt;
    [[-70,-52,30,8],[-15,-52,30,8],[35,-52,30,8],[80,-52,30,8],[-70,-2,30,8],[-15,-2,30,8],[35,-2,30,8],[80,-2,30,8],[5,62,30,8]].forEach(([x,z,w,d])=>{
      g.beginPath(); g.ellipse(px(x),py(z), px(w)-px(0), py(d)-py(0), 0, 0, Math.PI*2); g.fill();
    });

    const rects = B.map(b=>({x:b.x,z:b.z,w:(b.type==='洋房'?44:38)/2+7,d:(b.type==='洋房'?16:14)/2+7}));
    const rnd = mulberry32(20261104);
    const treeSpots = [];
    for(let i=0;i<230;i++){
      const x = -110 + rnd()*220;
      const z = -95 + rnd()*190;
      if(rects.some(r=>Math.abs(x-r.x)<r.w && Math.abs(z-r.z)<r.d)) continue;
      treeSpots.push({x,z,s:0.75+rnd()*0.75,kind:rnd()});
      const rr = 2.6 + rnd()*4.4;
      const shade = P.treeLo + Math.floor(rnd()*P.treeSpan);
      g.fillStyle = P.treeFill(shade);
      g.beginPath(); g.ellipse(px(x),py(z), rr*2.6, rr*2.0, rnd()*3, 0, Math.PI*2); g.fill();
      g.fillStyle = P.treeHi;
      g.beginPath(); g.ellipse(px(x)-3,py(z)-3, rr*1.2, rr*0.9, 0, 0, Math.PI*2); g.fill();
    }

    g.textAlign='center'; g.fillStyle=P.lblRiver; g.font='500 30px "PingFang SC",sans-serif';

    const tex = new THREE.CanvasTexture(cv);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

  function makeFacade(b, day){
    const cols = b.type === '洋房' ? 4 : 3;
    const rows = b.floors;
    const cv = document.createElement('canvas'); cv.width = 1024; cv.height = 1024;
    const em = document.createElement('canvas'); em.width = 1024; em.height = 1024;
    const g = cv.getContext('2d'); const e = em.getContext('2d');
    const M = 44;
    const cw = (1024 - M*2) / cols, ch = (1024 - M*2) / rows;
    const tint = (day ? ['#e8e2d4','#e4ddcf','#dfd7c8','#e9e1d1'] : ['#d8d1c3','#d4ccbc','#cfc7b7','#d9d0bf'])[b.id%4];
    const base = g.createLinearGradient(0,0,0,1024);
    base.addColorStop(0,tint); base.addColorStop(.55, day?'#ded7c7':'#c9c1b2'); base.addColorStop(1, day?'#cec5b5':'#b3aa9b');
    g.fillStyle = base; g.fillRect(0,0,1024,1024);
    for(let i=0;i<cols;i++){
      const x = M + i*cw;
      g.fillStyle = 'rgba(90,82,70,.18)';
      g.fillRect(x, M, 5, 1024-M*2);
    }
    g.fillStyle = 'rgba(255,255,255,.10)'; g.fillRect(0, M, 1024, 4);
    e.fillStyle = '#000'; e.fillRect(0,0,1024,1024);

    const floorRooms = roomsByB[b.id] || [];
    for(let f=1; f<=rows; f++){
      const yTop = 1024 - M - f*ch;
      g.fillStyle = 'rgba(100,92,80,.28)'; g.fillRect(M, yTop+ch-3, 1024-M*2, 3);
      if(b.type !== '洋房' && f < b.residentFrom){
        const lg = g.createLinearGradient(0, yTop, 0, yTop+ch);
        if(day){ lg.addColorStop(0,'#7b8387'); lg.addColorStop(.55,'#99a1a5'); lg.addColorStop(1,'#666e73'); }
        else { lg.addColorStop(0,'#2a2b2b'); lg.addColorStop(.55,'#3a342a'); lg.addColorStop(1,'#171a1e'); }
        g.fillStyle = lg; g.fillRect(M+10, yTop+ch*0.18, 1024-M*2-20, ch*0.68);
        if(!day){
          const eg = e.createLinearGradient(0, yTop, 0, yTop+ch);
          eg.addColorStop(0,'rgba(255,190,120,.10)'); eg.addColorStop(.6,'rgba(255,180,100,.55)'); eg.addColorStop(1,'rgba(255,160,80,.12)');
          e.fillStyle = eg; e.fillRect(M+10, yTop+ch*0.18, 1024-M*2-20, ch*0.68);
        }
        g.fillStyle = day ? 'rgba(35,42,48,.5)' : 'rgba(10,12,14,.65)';
        for(let d=0; d<3; d++) g.fillRect(1024/2-120+d*84, yTop+ch*0.34, 58, ch*0.52);
        continue;
      }
      const fr = floorRooms.filter(r=>r.f===f);
      fr.forEach(r=>{
        const c = cols - 1 - r.col;
        const x = M + c*cw + cw*0.17;
        const ww = cw*0.66;
        const y = yTop + ch*0.19;
        const hh = ch*0.46;
        const on = r.joined > 0;
        g.fillStyle = day ? 'rgba(96,88,76,.35)' : 'rgba(70,64,55,.42)';
        g.fillRect(x-3, y-3, ww+6, hh+6);
        if(on){
          const wg = g.createLinearGradient(0,y,0,y+hh);
          if(day){ wg.addColorStop(0,'#faf1dd'); wg.addColorStop(.5,'#f4e7c8'); wg.addColorStop(1,'#e9d6ae'); }
          else { wg.addColorStop(0,'#ffe3b4'); wg.addColorStop(.5,'#ffc477'); wg.addColorStop(1,'#e89b4f'); }
          g.fillStyle = wg; g.fillRect(x,y,ww,hh);
          g.fillStyle = day ? 'rgba(255,255,255,.5)' : 'rgba(255,255,255,.28)'; g.fillRect(x,y,ww,hh*0.16);
        }else{
          g.fillStyle = day ? '#b9c8d6' : '#1b2532'; g.fillRect(x,y,ww,hh);
          g.fillStyle = day ? 'rgba(255,255,255,.4)' : 'rgba(120,160,210,.07)'; g.fillRect(x,y,ww,hh*0.2);
        }
        g.fillStyle = 'rgba(60,55,48,.5)'; g.fillRect(x+ww/2-1, y, 2, hh);
        g.fillStyle = 'rgba(80,72,62,.30)'; g.fillRect(x-2, y+hh+4, ww+4, 2);
        if(on && !day){
          const grad = e.createRadialGradient(x+ww/2, y+hh/2, 2, x+ww/2, y+hh/2, ww*0.75);
          grad.addColorStop(0,'rgba(255,220,170,1)');
          grad.addColorStop(.5,'rgba(255,178,96,.85)');
          grad.addColorStop(1,'rgba(255,150,60,0)');
          e.fillStyle = grad;
          e.fillRect(x-6, y-6, ww+12, hh+12);
        }
      });
    }
    const map = new THREE.CanvasTexture(cv);
    map.encoding = THREE.sRGBEncoding; map.anisotropy = 8;
    const glow = new THREE.CanvasTexture(em);
    glow.encoding = THREE.sRGBEncoding; glow.anisotropy = 8;
    return {map, glow};
  }

    pTotal.textContent = b.total;
    pPct.textContent = Math.round(p) + '%';
    pRing.style.setProperty('--p', p.toFixed(1));
    pBar.style.width = p.toFixed(1) + '%';
    pSub.textContent = b.type === '洋房' ? '洋房 · 两单元四户（1F 两户）' : '小高层 · 两梯三户';

    const list = roomsByB[b.id] || [];
    const floors = [];
    for(let f=b.floors; f>=1; f--){
      if(f < b.residentFrom){
        floors.push(`<div class="frow void"><div class="fno">${f}F</div><div class="fchips">架空层 / 入户大堂</div><div class="fc"></div></div>`);
        continue;
      }
      const fr = list.filter(r=>r.f===f).sort((a,c)=>c.col-a.col);
      const chips = fr.map(r=>{
        const label = b.type==='洋房' ? `${r.u}-${f}${String(r.no).padStart(2,'0')}` : `${f}${String(r.no).padStart(2,'0')}`;
        const cls = r.joined>0 ? 'chip on' : 'chip';
        return `<span class="${cls}" title="${r.key}">${label}</span>`;
      }).join('');
      const cnt = fr.filter(r=>r.joined>0).length;
      floors.push(`<div class="frow"><div class="fno">${f}F</div><div class="fchips">${chips}</div><div class="fc ${cnt===fr.length?'full':''}">${cnt}/${fr.length}</div></div>`);
    }
    pFloors.innerHTML = floors.join('');
    pNote.textContent = b.type === '洋房'
      ? '7 层洋房：1F 2 户，2–7F 每层 4 户；逐户状态按房号归并，不含业主姓名。'
      : '逐户状态按房号归并，不含业主姓名。';
  }

  let camAnim = null;
  function focus(b){
    const h = heightOf(b);
    const dir = camera.position.clone().sub(controls.target);
    dir.y = 0; dir.normalize();
    const dist = b.type==='洋房' ? 88 : 116;
    const pos = new THREE.Vector3(b.x, Math.max(58, h*1.35), b.z).addScaledVector(dir, dist);
    const target = new THREE.Vector3(b.x, b.type==='洋房' ? 8 : 14, b.z);
    camAnim = {t:0, fromPos:camera.position.clone(), toPos:pos, fromT:controls.target.clone(), toT:target, dur:0.45};
  }
  function openPanel(b){
    if(!b || !b.total) return;
    selected = b;
    renderPanel(b);
    panel.classList.add('open');
    const r = (b.type==='洋房' ? 30 : 27);
    ring.scale.set(r, r, 1);
    ring2.scale.set(r*1.5, r*1.5, 1);
    ring.position.set(b.x, 0.85, b.z);
    ring2.position.set(b.x, 0.84, b.z);
    ring.visible = true; ring2.visible = true;
    focus(b);
  }
  function closePanel(){
    panel.classList.remove('open');
    ring.visible = false; ring2.visible = false;
    selected = null;
  }
  function resetView(){
    closePanel();
    camAnim = {t:0, fromPos:camera.position.clone(), toPos:HOME_POS.clone(), fromT:controls.target.clone(), toT:HOME_TARGET.clone(), dur:0.45};
  }
  const ease = t => t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
  document.getElementById('pClose').addEventListener('click', closePanel);
  document.getElementById('reset').addEventListener('click', resetView);
  const tourBtn = document.getElementById('tour');
  tourBtn.addEventListener('click', ()=>{
    controls.autoRotate = !controls.autoRotate;
    tourBtn.classList.toggle('on', controls.autoRotate);
  });

  /* ---------- day / night theme ---------- */
  let themeT = 0, themeTarget = 0;
  const themeBtn = document.getElementById('themeBtn');
  const themeTxt = document.getElementById('themeTxt');
  function applyTheme(day, instant){
    document.body.classList.toggle('day', day);
    themeTxt.textContent = day ? '夜间模式' : '日间模式';
    try{ localStorage.setItem('spax-theme', day ? 'day' : 'night'); }catch(_){}
    themeTarget = day ? 1 : 0;
    if(instant) themeT = themeTarget;
    siteMat.map = day ? siteDay.tex : siteNight.tex; siteMat.needsUpdate = true;
    facades.forEach(f=>{
      const k = day ? 'd' : 'n';
      if(!f[k]) f[k] = makeFacade(f.b, day);
      f.mat.map = f[k].map;
      f.mat.emissiveMap = f[k].glow;
      f.mat.needsUpdate = true;
    });
  }
  themeBtn.addEventListener('click', ()=>applyTheme(themeTarget < 0.5));
  applyTheme((()=>{ try{ return localStorage.getItem('spax-theme') === 'day'; }catch(_){ return false; } })(), true);
  function toNDC(e){
    mouse.x = (e.clientX / innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  }
  function pick(e){
    toNDC(e);
    ray.setFromCamera(mouse, camera);
    const hits = ray.intersectObjects(pickMeshes, false);
    return hits.length ? hits[0].object.userData.b : null;
  }
  let down = null;
  canvas.addEventListener('pointerdown', e=>{ down = {x:e.clientX, y:e.clientY}; camAnim = null; });
  canvas.addEventListener('pointerup', e=>{
    if(!down) return;
    const moved = Math.hypot(e.clientX-down.x, e.clientY-down.y);
    down = null;
    if(moved > 5) return;
    const b = pick(e);
    if(b) openPanel(b); else closePanel();
  });
  canvas.addEventListener('pointermove', e=>{
    const b = pick(e);
    if(b !== hovered){
      hovered = b;
      canvas.style.cursor = b ? 'pointer' : 'grab';
    }
    if(b){
      const p = (b.rate*100).toFixed(1);
      tip.querySelector('b').textContent = b.name;
      tip.querySelector('span').innerHTML = `${b.joined}/${b.total} 户已入群 · <em>${p}%</em>`;
      tip.style.left = e.clientX+'px';
      tip.style.top = e.clientY+'px';
      tip.style.opacity = 1;
    } else {
      tip.style.opacity = 0;
    }
  });
  canvas.addEventListener('pointerleave', ()=>{ tip.style.opacity = 0; hovered = null; });

  const t0 = performance.now();
  let introDone = false;
  function animate(){
    requestAnimationFrame(animate);
    const now = performance.now();
    if(!introDone){
      const t = (now - t0) / 820;
      let done = true;
      groups.forEach((g,i)=>{
        const local = Math.min(1, Math.max(0, (t - i*0.022) / 0.72));
        const e = 1 - Math.pow(1-local, 3);
        g.scale.y = Math.max(0.001, e);
        const l = Math.min(1, Math.max(0, (local - 0.25) / 0.75));
        labels[i].material.opacity = l;
        if(local < 1) done = false;
      });
      if(done && t > 1.05){ introDone = true; }
      if(t < 1){
        const k = ease(Math.min(1, t));
        camera.position.lerpVectors(new THREE.Vector3(-220,290,390), HOME_POS, k);
      }
    }
    if(camAnim){
      camAnim.t += 0.016;
      const k = ease(Math.min(1, camAnim.t / camAnim.dur));
      camera.position.lerpVectors(camAnim.fromPos, camAnim.toPos, k);
      controls.target.lerpVectors(camAnim.fromT, camAnim.toT, k);
      if(camAnim.t >= camAnim.dur) camAnim = null;
    }
    if(selected){
      const t = now * 0.0016;
      ring.material.opacity = 0.38 + Math.sin(t)*0.16;
      ring2.material.opacity = 0.08 + Math.sin(t+1)*0.04;
    }
    themeT += (themeTarget - themeT) * 0.065;
    if(Math.abs(themeTarget - themeT) < 0.0015) themeT = themeTarget;
    colFaders.forEach(f=>f.c.copy(f.n).lerp(f.d, themeT));
    numFaders.forEach(f=>{ f.o[f.p] = f.n + (f.d - f.n) * themeT; });
    skyNight.material.opacity = 1 - themeT;
    skyDay.material.opacity = themeT;
    skyNight.position.copy(camera.position);
    skyDay.position.copy(camera.position);
    controls.update();
    renderer.render(scene, camera);
  }
  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  animate();
  setTimeout(()=>document.getElementById('load').classList.add('done'), 420);
  window.__MODEL = {D, openPanel, resetView};
})();
</script>
</body>
</html>
